<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - SweetBite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f8; font-family: 'Segoe UI', sans-serif; }
        .checkout-box { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 35px; margin-top: 40px; margin-bottom: 50px; }
        .btn-finalizar { background-color: #d81b60; color: white; border-radius: 25px; font-weight: bold; width: 100%; padding: 12px; }
        .btn-finalizar:hover { background-color: #ad1457; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="checkout-box">
                    <h3 class="fw-bold text-center text-danger mb-4">🧁 Finalizar Compra</h3>
                    <div class="card bg-light border-0 p-3 mb-4 rounded-3">
                        <div class="d-flex align-items-center">
                            <img src="{{ produto.imagem_url }}" width="70" height="70" class="rounded-3 me-3" style="object-fit:cover;">
                            <div>
                                <h6 class="mb-1 fw-bold">{{ produto.nome }}</h6>
                                <p class="mb-0 text-muted small">{{ produto.descricao }}</p>
                                <span class="fw-bold text-danger">R$ {{ "%.2f"|format(produto.preco) }} unitário</span>
                            </div>
                        </div>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nome Completo *</label>
                            <input type="text" name="nome" class="form-control" placeholder="Seu nome" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">E-mail *</label>
                                <input type="email" name="email" class="form-control" placeholder="nome@email.com" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Telefone / WhatsApp *</label>
                                <input type="tel" name="telefone" class="form-control" placeholder="(11) 99999-9999" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Endereço de Entrega (com CEP) *</label>
                            <input type="text" name="endereco" class="form-control" placeholder="Rua, número, complemento e bairro" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Quantidade</label>
                                <input type="number" name="quantidade" class="form-control" value="1" min="1" max="50" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Forma de Pagamento</label>
                                <select class="form-select">
                                    <option>PIX (Aprovação Imediata)</option>
                                    <option>Cartão de Crédito</option>
                                    <option>Pagar na Entrega</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Instruções Especiais / Mensagem no Cartão</label>
                            <textarea name="observacao" class="form-control" rows="2" placeholder="Deseja escrever algo no cartão de presente ou tem restrições alimentares?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-finalizar">Confirmar e Gerar Pedido</button>
                        <a href="/" class="btn btn-link text-muted d-block text-center mt-2">Voltar ao catálogo</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
